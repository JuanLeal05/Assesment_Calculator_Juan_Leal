services:
  backend:
    build:
      context: ./backend
      target: runtime
    image: calculator-backend
    ports:
      - "8000:8000"
    environment:
      # JSON list, read by pydantic-settings (calculator/config.py).
      CORS_ORIGINS: '["http://localhost:5173"]'
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    image: calculator-frontend
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
